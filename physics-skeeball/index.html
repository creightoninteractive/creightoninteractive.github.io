  <!-- SkeeBall minimal viewport fit --><style>html,body{width:100%;height:100%;overflow:hidden;background:#202838;}body{display:flex;align-items:center;justify-content:center;}#unity-canvas{display:block;width:min(100vw,177.864583vh)!important;height:auto!important;aspect-ratio:1366/768;position:relative!important;touch-action:none;}</style></head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
<!-- V6.1 single artwork loading layer -->
<div id="creighton-loading" aria-label="Preparing Physics Skee-Ball">
  <img id="creighton-loading-art" src="Loading_Screen_Neon_Physics_travelingtoCreightonsArcade.png" alt="Traveling to Creighton's Arcade. Preparing Physics Skee-Ball" decoding="sync" fetchpriority="high">
  <p id="creighton-load-error" role="alert" hidden></p>
</div>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050e19;}
#unity-canvas{background:#202838!important;}
#creighton-loading{position:fixed;inset:0;z-index:2147483647;background:#050e19;display:flex;align-items:center;justify-content:center;opacity:1;transition:opacity .5s ease;touch-action:none;}
#creighton-loading-art{display:block;width:100%;height:100%;object-fit:contain;}
#creighton-loading.fading{opacity:0;}
#creighton-load-error{position:absolute;bottom:0;left:0;right:0;padding:12px;margin:0;background:#07101f;color:white;font:16px sans-serif;text-align:center;}
</style>
<script>
(function(){
  'use strict';
  const layer=document.getElementById('creighton-loading'),art=document.getElementById('creighton-loading-art');
  let timer;
  const state=window.CreightonLoading={minimumMs:3000,fadeMs:500,artVisibleAt:null,sceneReadyAt:null,runtimeReadyAt:null,fadeStartedAt:null,finishedAt:null,
    sceneReady(){state.sceneReadyAt=performance.now();check();},
    runtimeReady(){state.runtimeReadyAt=performance.now();check();},
    fail(message){state.failed=true;clearTimeout(timer);const error=document.getElementById('creighton-load-error');error.hidden=false;error.textContent='Unable to start Physics Skee-Ball. Please reload the page.';console.error(message);}
  };
  function check(){
    if(state.failed||state.fadeStartedAt!==null||state.artVisibleAt===null||state.sceneReadyAt===null||state.runtimeReadyAt===null)return;
    clearTimeout(timer);
    const remaining=state.minimumMs-(performance.now()-state.artVisibleAt);
    if(remaining>0){timer=setTimeout(check,remaining+1);return;}
    // Two animation frames ensure the ready canvas has been presented behind the artwork.
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      state.fadeStartedAt=performance.now();layer.classList.add('fading');
      setTimeout(()=>{layer.remove();state.finishedAt=performance.now();document.getElementById('unity-canvas').focus({preventScroll:true});},state.fadeMs);
    }));
  }
  async function artworkReady(){
    if(state.artVisibleAt!==null)return;
    try{await art.decode();}catch(error){state.fail(error);return;}
    requestAnimationFrame(()=>{state.artVisibleAt=performance.now();check();});
  }
  art.addEventListener('load',artworkReady,{once:true});
  art.addEventListener('error',()=>state.fail('Loading artwork unavailable'),{once:true});
  if(art.complete&&art.naturalWidth)artworkReady();
  // Do not allow mouse, touch, or keyboard to skip the minimum/readiness barrier.
  function protect(event){if(document.getElementById('creighton-loading')){event.preventDefault();event.stopImmediatePropagation();}}
  for(const name of ['keydown','keyup','pointerdown','pointerup','click','touchstart','touchend'])window.addEventListener(name,protect,{capture:true,passive:false});
})();
</script>
