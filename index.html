<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creighton Interactive</title>
  <meta name="theme-color" content="#02060c" />
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(rgba(0,0,0,0.06), rgba(0,0,0,0.26)),
        url("CreightonInteractiveLogo16_9.png") center center / cover no-repeat;
    }

    .launch-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 0 24px 7vh;
    }

    .launch-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 64px;
      padding: 0 34px;
      border-radius: 14px;
      border: 2px solid rgba(255,255,255,0.72);
      background: linear-gradient(135deg, #19d8ff, #65e9ff);
      color: #041019;
      text-decoration: none;
      font-size: clamp(18px, 2vw, 26px);
      font-weight: 800;
      letter-spacing: 0.01em;
      text-align: center;
      box-shadow:
        0 0 28px rgba(25,216,255,0.60),
        0 10px 34px rgba(0,0,0,0.55);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .launch-button:hover,
    .launch-button:focus-visible {
      transform: translateY(-3px) scale(1.015);
      box-shadow:
        0 0 42px rgba(25,216,255,0.82),
        0 15px 42px rgba(0,0,0,0.60);
      outline: none;
    }

    @media (max-width: 700px) {
      body {
        background-position: center center;
      }

      .launch-wrap {
        padding-bottom: 5vh;
      }

      .launch-button {
        width: min(92vw, 420px);
        min-height: 58px;
        padding: 0 22px;
      }
    }
  </style>
</head>
<body>
  <div class="launch-wrap">
    <a class="launch-button" href="/physics-skeeball/">
      Play Creighton Skee-Ball Physics
    </a>
  </div>
</body>
</html>
